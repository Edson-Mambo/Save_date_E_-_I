<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin | Irina & Edson</title><link rel="stylesheet" href="admin.css?v=20260921-8"></head>
<body>
<div id="loginView" class="screen"><div class="panel login"><div class="mark">I <span>♥</span> E</div><p class="eyebrow">ÁREA PRIVADA</p><h1>Administração do convite</h1><p>Painel privado para editar cada texto, data, contacto e imagem do convite.</p><form id="loginForm"><input id="email" type="email" placeholder="Email autorizado" autocomplete="username" required><input id="password" type="password" placeholder="Palavra-passe" autocomplete="current-password" required><button>Entrar no painel</button></form><p id="loginMsg" class="msg"></p><a href="./" class="back">← Voltar ao convite</a></div></div>
<div id="adminView" class="hidden"><header class="admin-head"><div><span class="eyebrow">PAINEL PRIVADO</span><h1>Irina & Edson</h1></div><div class="head-actions"><a href="./" target="_blank">Ver convite ↗</a><button id="logout">Sair</button></div></header>
<main class="admin-main"><div id="status" class="status"></div><section class="section guest-section"><div class="section-head"><h2>Convidados</h2><span>Links personalizados</span></div><div class="guest-tools"><div class="guest-form"><label>Tipo<select id="guestType"><option value="single">Uma pessoa</option><option value="couple">Casal</option><option value="family">Família</option><option value="group">Grupo</option></select></label><label>Nome 1<input id="guestName1" placeholder="Ex.: João"></label><label>Nome 2<input id="guestName2" placeholder="Ex.: Maria"></label><label>Nº de pessoas<input id="guestCount" type="number" min="1" max="20" value="1"></label><button id="addGuest" type="button">Adicionar convidado + gerar link</button></div><div id="guestList" class="guest-list"></div></div></section><section id="editor"></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=20260921-8"></script></body></html>
